[build]
  publish = "_site"
  command = "npm run build"

# Images — hashed filenames from eleventy-img make 1-year cache safe
[[headers]]
  for = "/assets/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS and CSS — no hashed filenames so keep short to pick up deploys
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/tailwind/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML — always revalidate so users get the latest content after a deploy
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
